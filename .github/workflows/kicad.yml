name: kicad

# KiCadKit, KiCadLink and KiCadRouter checked against KiCad itself: boards JSpice writes read and checked by kicad-cli,
# footprints placed from KiCad's own libraries, the router's geometry and routes against KiCad's own code (built from
# KiCad's sources by tools/kicad-reference). They are Foundation only, so this runs on Linux, where KiCad 10 installs from its
# PPA (the macOS runners have no KiCad, and the tests that need it skip there).
on:
  push:
    paths: ['macos/Sources/KiCadKit/**', 'macos/Sources/KiCadLink/**', 'macos/Sources/KiCadRouter/**',
            'macos/Tests/KiCadKitTests/**', 'macos/Tests/KiCadLinkTests/**', 'macos/Tests/KiCadRouterTests/**',
            'macos/tools/kicad-reference/**', 'macos/Package.resolved', 'macos/scripts/kicad-linux-tests.sh',
            '.github/workflows/kicad.yml']
  pull_request:
    paths: ['macos/Sources/KiCadKit/**', 'macos/Sources/KiCadLink/**', 'macos/Sources/KiCadRouter/**',
            'macos/Tests/KiCadKitTests/**', 'macos/Tests/KiCadLinkTests/**', 'macos/Tests/KiCadRouterTests/**',
            'macos/tools/kicad-reference/**', 'macos/Package.resolved', 'macos/scripts/kicad-linux-tests.sh',
            '.github/workflows/kicad.yml']
  workflow_dispatch:

jobs:
  kicad:
    runs-on: ubuntu-24.04
    # (the router against KiCad on the arc boards and every mode takes the most of it; KiCad installing from its PPA
    # now and then takes as long again)
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: KiCad 10
        run: |
          sudo add-apt-repository -y ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          # the libraries the boards' footprints come from, without the 3D models
          sudo apt-get install -y --no-install-recommends kicad kicad-footprints kicad-templates
          kicad-cli version
      - name: Toolchain
        run: swift --version
      - name: KiCadKit, KiCadLink and KiCadRouter tests, against KiCad
        env:
          JSPICE_REQUIRE_KICAD: "1"
        run: macos/scripts/kicad-linux-tests.sh
      - name: KiCad's sources and objects, kept between runs
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/kicad-reference
          key: kicad-reference-10.0.7-${{ hashFiles('macos/tools/kicad-reference/build.sh', 'macos/tools/kicad-reference/stubs.cpp', 'macos/tools/kicad-reference/patch.py') }}
          restore-keys: kicad-reference-10.0.7-
      - name: KiCad's own geometry and router code, built
        run: |
          sudo apt-get install -y --no-install-recommends g++ libwxgtk3.2-dev libboost-dev libglm-dev
          KICAD_REFERENCE_BUILD="$RUNNER_TEMP/kicad-reference" macos/tools/kicad-reference/build.sh 2000
      - name: 1000 random boards routed by KiCad's router
        # (a new seed each run: the run number, which the boards' names carry)
        run: |
          python3 macos/tools/kicad-reference/scenes.py "$RUNNER_TEMP/kicad-reference/kicad-router" \
            "$RUNNER_TEMP/kicad-reference/routes-1000.json" 1000 "$GITHUB_RUN_NUMBER"
      - name: 400 random boards with routes that shove what is in their way, routed by KiCad's router
        # (also a new seed each run; the board as the router has it after each step goes with them)
        run: |
          python3 macos/tools/kicad-reference/scenes.py --mode shove "$RUNNER_TEMP/kicad-reference/kicad-router" \
            "$RUNNER_TEMP/kicad-reference/routes-shove-400.json" 400 "$GITHUB_RUN_NUMBER"
      - name: 400 random boards with tracks and vias dragged by KiCad's router
        # (also a new seed each run; what the dragger dragged, and the board as it has it, after each step)
        run: |
          python3 macos/tools/kicad-reference/scenes.py --mode drag "$RUNNER_TEMP/kicad-reference/kicad-router" \
            "$RUNNER_TEMP/kicad-reference/routes-drag-400.json" 400 "$GITHUB_RUN_NUMBER"
      - name: 100 random boards with differential pairs routed by KiCad's router
        # (also a new seed each run; the pair's two lines, and the board as the router has it, after each step)
        run: |
          python3 macos/tools/kicad-reference/scenes.py --mode diffpair "$RUNNER_TEMP/kicad-reference/kicad-router" \
            "$RUNNER_TEMP/kicad-reference/routes-diffpair-100.json" 100 "$GITHUB_RUN_NUMBER"
      - name: 200 random boards with arc tracks, and routes from and to them in every corner mode, routed by KiCad's router
        # (also a new seed each run; walking round, shoving and marking, the lines' arcs after each step)
        run: |
          python3 macos/tools/kicad-reference/scenes.py --arcs --rounded --mode mix "$RUNNER_TEMP/kicad-reference/kicad-router" \
            "$RUNNER_TEMP/kicad-reference/routes-arcs-200.json" 200 "$GITHUB_RUN_NUMBER"
      - name: 150 random boards with arc tracks, tracks, arcs and vias dragged by KiCad's router
        # (also a new seed each run)
        run: |
          python3 macos/tools/kicad-reference/scenes.py --arcs --mode drag "$RUNNER_TEMP/kicad-reference/kicad-router" \
            "$RUNNER_TEMP/kicad-reference/routes-arcs-drag-150.json" 150 "$GITHUB_RUN_NUMBER"
      - name: 10 boards with differential pairs made by KiCad, and pairs on them routed by its router
        # (also a new seed each run)
        run: |
          python3 macos/tools/kicad-reference/boards.py --pairs "$RUNNER_TEMP/pairboards" 10 "$GITHUB_RUN_NUMBER"
          python3 macos/tools/kicad-reference/scenes.py --mode diffpair --boards "$RUNNER_TEMP/kicad-reference/kicad-router" \
            "$RUNNER_TEMP/board-diffpair-routes.json" 1 "$GITHUB_RUN_NUMBER" "$RUNNER_TEMP"/pairboards/*.json
      - name: 60 random boards made by KiCad and 20 of its footprints with custom pads, what its router sees of each, and routes on them by its router
        # (also a new seed each run)
        run: |
          python3 macos/tools/kicad-reference/boards.py "$RUNNER_TEMP/boards" 60 "$GITHUB_RUN_NUMBER"
          python3 macos/tools/kicad-reference/boards.py --custom-pads "$RUNNER_TEMP/boards" 20 "$GITHUB_RUN_NUMBER"
          python3 macos/tools/kicad-reference/scenes.py --boards "$RUNNER_TEMP/kicad-reference/kicad-router" \
            "$RUNNER_TEMP/board-routes.json" 4 "$GITHUB_RUN_NUMBER" "$RUNNER_TEMP"/boards/*.json
          python3 macos/tools/kicad-reference/scenes.py --mode shove --boards "$RUNNER_TEMP/kicad-reference/kicad-router" \
            "$RUNNER_TEMP/board-shove-routes.json" 2 "$GITHUB_RUN_NUMBER" "$RUNNER_TEMP"/boards/*.json
          python3 macos/tools/kicad-reference/scenes.py --mode drag --boards "$RUNNER_TEMP/kicad-reference/kicad-router" \
            "$RUNNER_TEMP/board-drag-routes.json" 2 "$GITHUB_RUN_NUMBER" "$RUNNER_TEMP"/boards/*.json
      - name: 20 random boards with arc tracks made by KiCad, and routes in every corner mode and drags on them by its router
        # (also a new seed each run; the boards then go with the others, for their worlds)
        run: |
          python3 macos/tools/kicad-reference/boards.py --arcs "$RUNNER_TEMP/arcboards" 20 "$GITHUB_RUN_NUMBER"
          python3 macos/tools/kicad-reference/scenes.py --arcs --rounded --mode mix --boards "$RUNNER_TEMP/kicad-reference/kicad-router" \
            "$RUNNER_TEMP/board-arc-routes.json" 2 "$GITHUB_RUN_NUMBER" "$RUNNER_TEMP"/arcboards/*.json
          python3 macos/tools/kicad-reference/scenes.py --arcs --mode drag --boards "$RUNNER_TEMP/kicad-reference/kicad-router" \
            "$RUNNER_TEMP/board-arc-drag-routes.json" 2 "$GITHUB_RUN_NUMBER" "$RUNNER_TEMP"/arcboards/*.json
          cp "$RUNNER_TEMP"/arcboards/* "$RUNNER_TEMP/boards/"
      - name: KiCad's design rules check of the 100 boards
        # (kicad-cli's report of each, next to it, for the port's DRC)
        run: python3 macos/tools/kicad-reference/drc.py "$RUNNER_TEMP"/boards/*.kicad_pcb
      - name: KiCad's courtyards of the 100 boards' footprints
        # (each footprint's BuildCourtyardCaches, next to its board, for the port's)
        run: python3 macos/tools/kicad-reference/courtyards.py "$RUNNER_TEMP"/boards/*.kicad_pcb
      - name: KiCad's texts of the 100 boards and each copper layer's copper
        # (each text's strokes and boxes, and the copper the sliver check unites, next to its board, for the port's)
        run: |
          python3 macos/tools/kicad-reference/texts.py "$RUNNER_TEMP"/boards/*.kicad_pcb
          python3 macos/tools/kicad-reference/copper.py "$RUNNER_TEMP"/boards/*.kicad_pcb
      - name: KiCadRouter against KiCad's code, on 2000 cases of each kind, the 1000, two 400, 100, 200 and 150 boards and the 90 real ones
        # (the real boards' worlds as KiCad's router sees them, their routes as it routes them, their DRC as KiCad's
        # finds it, and routes the port makes on them through kicad-cli's DRC)
        env:
          JSPICE_REQUIRE_KICAD: "1"
          KICAD_GEOMETRY_REFERENCE: ${{ runner.temp }}/kicad-reference/kicad-geometry-2000.json
          KICAD_CLIPPER_REFERENCE: ${{ runner.temp }}/kicad-reference/kicad-clipper-2000.json
          KICAD_ARC_GEOMETRY_REFERENCE: ${{ runner.temp }}/kicad-reference/kicad-arc-geometry-2000.json
          KICAD_ROUTER_REFERENCE: ${{ runner.temp }}/kicad-reference/routes-1000.json:${{ runner.temp }}/kicad-reference/routes-shove-400.json:${{ runner.temp }}/kicad-reference/routes-drag-400.json:${{ runner.temp }}/kicad-reference/routes-diffpair-100.json:${{ runner.temp }}/board-routes.json:${{ runner.temp }}/board-shove-routes.json:${{ runner.temp }}/board-drag-routes.json:${{ runner.temp }}/board-diffpair-routes.json:${{ runner.temp }}/kicad-reference/routes-arcs-200.json:${{ runner.temp }}/kicad-reference/routes-arcs-drag-150.json:${{ runner.temp }}/board-arc-routes.json:${{ runner.temp }}/board-arc-drag-routes.json
          KICAD_BOARD_REFERENCE: ${{ runner.temp }}/boards
          KICAD_DRC_KEEP: ${{ runner.temp }}/drc-failures
        run: macos/scripts/kicad-linux-tests.sh --filter KiCadRouterTests
      - name: Boards the router got wrong, to look at
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kicad-router-failures
          path: |
            ${{ runner.temp }}/drc-failures
            ${{ runner.temp }}/boards
            ${{ runner.temp }}/pairboards
            ${{ runner.temp }}/arcboards
          if-no-files-found: ignore
