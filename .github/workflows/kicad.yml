name: kicad

# KiCadKit and KiCadLink checked against KiCad itself: boards JSpice writes read and checked by kicad-cli, footprints
# placed from KiCad's own libraries. They are Foundation only, so this runs on Linux, where KiCad 10 installs from its
# PPA (the macOS runners have no KiCad, and the tests that need it skip there).
on:
  push:
    paths: ['macos/Sources/KiCadKit/**', 'macos/Sources/KiCadLink/**', 'macos/Tests/KiCadKitTests/**',
            'macos/Tests/KiCadLinkTests/**', 'macos/Package.resolved', 'macos/scripts/kicad-linux-tests.sh',
            '.github/workflows/kicad.yml']
  pull_request:
    paths: ['macos/Sources/KiCadKit/**', 'macos/Sources/KiCadLink/**', 'macos/Tests/KiCadKitTests/**',
            'macos/Tests/KiCadLinkTests/**', 'macos/Package.resolved', 'macos/scripts/kicad-linux-tests.sh',
            '.github/workflows/kicad.yml']
  workflow_dispatch:

jobs:
  kicad:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: KiCad 10
        run: |
          sudo add-apt-repository -y ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          # the libraries the boards' footprints come from, without the 3D models
          sudo apt-get install -y --no-install-recommends kicad kicad-footprints kicad-templates
          kicad-cli version
      - name: Toolchain
        run: swift --version
      - name: KiCadKit and KiCadLink tests, against KiCad
        env:
          JSPICE_REQUIRE_KICAD: "1"
        run: macos/scripts/kicad-linux-tests.sh
