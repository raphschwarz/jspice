name: macos

# The fast lane: on every push and pull request touching the Mac app, a pass or fail from the tests that need no
# downloads, and the app (the JSpice-macOS artifact the README points to), checked by the MCP smoke test, auval, its
# self-test and its screenshots. The benchmarks, the toolchain and firmware builds with the tests they gate, the makers'
# models and the capture evaluation run in the full lane (macos-full.yml), nightly and on demand.

on:
  push:
    paths: ['macos/**', '.github/workflows/macos.yml']
  pull_request:
    paths: ['macos/**', '.github/workflows/macos.yml']
  workflow_dispatch:

# a newer push to the same branch (or pull request) cancels the run it supersedes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # the engine's tests, beside the app's job rather than after it
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Test the simulation engine (the tests that need no downloaded toolchain, firmware or makers' models)
        timeout-minutes: 25
        # optimised, as the app runs it: audio-rate tests take minutes in a debug build
        # (JSPICE_REQUIRE_TOOLCHAIN, JSPICE_MAKER_MODELS and the firmware's JSPICE_*_HEX are left unset here, so the
        # tests that need them skip: they run in macos-full.yml, after the steps that install and build what they need)
        run: |
          set -o pipefail
          swift test -c release -Xswiftc -enable-testing 2>&1 | tee "$RUNNER_TEMP/test.log"
      # (the test log runs to thousands of lines: the failures alone, where there are any)
      - name: What failed
        if: failure()
        run: |
          grep -E "error: |' failed \(" "$RUNNER_TEMP/test.log" | tail -120 || true
      - name: Build
        run: swift build

  # the app: packaged, checked, and uploaded as the JSpice-macOS artifact
  app:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Package JSpice.app
        if: hashFiles('macos/scripts/bundle.sh') != ''
        run: ./scripts/bundle.sh
      - name: MCP server smoke test
        if: hashFiles('macos/scripts/bundle.sh') != ''
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"load_example","arguments":{"id":"lfo"}}}' \
            '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"simulate","arguments":{"duration":2,"probes":["V(U2)"],"points":5}}}' \
            | ./build/JSpice.app/Contents/MacOS/jspice-mcp --headless | tee build/mcp.txt
          test "$(wc -l < build/mcp.txt)" -eq 4
          grep -q '"build_circuit"' build/mcp.txt
          grep -q 'frequency' build/mcp.txt
      - name: Audio Unit validation (registers the extension, then Apple's auval checks the effect and the instrument)
        if: hashFiles('macos/scripts/bundle.sh') != ''
        timeout-minutes: 8
        run: |
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f -R "$PWD/build/JSpice.app"
          pluginkit -a "$PWD/build/JSpice.app/Contents/PlugIns/JSpiceAudioUnit.appex"
          pluginkit -m -v -i org.knowm.jspice.mac.audiounit || true
          sleep 3
          auval -a | grep -i jspc || true
          auval -v aufx jsfx JSpc
          auval -v aumu jsin JSpc
      - name: Interaction test (draws a circuit with synthesized mouse events)
        if: hashFiles('macos/scripts/bundle.sh') != ''
        run: ./build/JSpice.app/Contents/MacOS/JSpice --self-test "$PWD/build/screenshots"
      - name: Render screenshots
        if: hashFiles('macos/scripts/bundle.sh') != ''
        run: ./build/JSpice.app/Contents/MacOS/JSpice --screenshots "$PWD/build/screenshots"
      - name: Upload app
        if: hashFiles('macos/scripts/bundle.sh') != ''
        uses: actions/upload-artifact@v4
        with:
          name: JSpice-macOS
          path: macos/build/JSpice-macOS.zip
      - name: Upload screenshots
        if: always() && hashFiles('macos/scripts/bundle.sh') != ''
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: macos/build/screenshots

  # the only job that writes to the repository: it pushes the app job's screenshots to a branch
  publish-screenshots:
    needs: app
    # (whatever the app job's result, as before, but not for a run a newer push cancelled: its screenshots are older)
    if: ${{ !cancelled() && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download screenshots
        # (none when the app job stopped before rendering any)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: screenshots
          path: macos/build/screenshots
      # artifacts need a browser login to download, so the screenshots are also kept on a branch for easy viewing
      - name: Publish screenshots to the ci/macos-screenshots branch
        if: always() && github.event_name == 'push' && hashFiles('macos/build/screenshots/*.png') != ''
        working-directory: macos/build/screenshots
        run: |
          git init -q -b screenshots
          git add -- *.png
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "Screenshots of ${GITHUB_SHA}"
          # two runs finishing together race for the branch: the screenshots are a convenience, so losing is no failure
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" screenshots:ci/macos-screenshots \
            || echo "::warning::another run published its screenshots at the same moment"
