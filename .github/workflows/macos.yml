name: macos

on:
  push:
    paths: ['macos/**', '.github/workflows/macos.yml']
  pull_request:
    paths: ['macos/**', '.github/workflows/macos.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Build
        run: swift build
      - name: Package JSpice.app
        if: hashFiles('macos/scripts/bundle.sh') != ''
        run: ./scripts/bundle.sh
      - name: MCP server smoke test
        if: hashFiles('macos/scripts/bundle.sh') != ''
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"load_example","arguments":{"id":"lfo"}}}' \
            '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"simulate","arguments":{"duration":2,"probes":["V(U2)"],"points":5}}}' \
            | ./build/JSpice.app/Contents/MacOS/jspice-mcp --headless | tee build/mcp.txt
          test "$(wc -l < build/mcp.txt)" -eq 4
          grep -q '"build_circuit"' build/mcp.txt
          grep -q 'frequency' build/mcp.txt
      - name: Audio Unit validation (registers the extension, then Apple's auval checks the effect and the instrument)
        if: hashFiles('macos/scripts/bundle.sh') != ''
        # still finding out how far a CI runner's audio system goes; its output is read until it passes reliably
        continue-on-error: true
        timeout-minutes: 8
        run: |
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f -R "$PWD/build/JSpice.app"
          pluginkit -a "$PWD/build/JSpice.app/Contents/PlugIns/JSpiceAudioUnit.appex"
          pluginkit -m -v -i org.knowm.jspice.mac.audiounit || true
          sleep 3
          auval -a | grep -i jspc || true
          auval -v aufx jsfx JSpc
          auval -v aumu jsin JSpc
      - name: Simulation speed at audio rate (release build)
        if: hashFiles('macos/scripts/bundle.sh') != ''
        timeout-minutes: 5
        run: |
          ./build/JSpice.app/Contents/MacOS/jspice-mcp --benchmark 0.25
          # where the time goes, for the heaviest synth example
          ./build/JSpice.app/Contents/MacOS/jspice-mcp --benchmark 60 voice > /dev/null &
          sleep 1
          sample $! 3 -file build/profile.txt > /dev/null 2>&1 || true
          kill $! 2>/dev/null || true
          sed -n '/Sort by top of stack/,$p' build/profile.txt | head -45
          # and for the Pico running flat out
          ./build/JSpice.app/Contents/MacOS/jspice-mcp --benchmark 60 pico-knob > /dev/null &
          sleep 1
          sample $! 3 -file build/profile-pico.txt > /dev/null 2>&1 || true
          kill $! 2>/dev/null || true
          sed -n '/Sort by top of stack/,$p' build/profile-pico.txt | head -45
      - name: Chip support (installs Arduino's AVR toolchain as the app does, compiles a sketch)
        if: hashFiles('macos/scripts/bundle.sh') != ''
        timeout-minutes: 10
        run: |
          ./build/JSpice.app/Contents/MacOS/jspice-mcp --install-chip-support avr
          ./build/JSpice.app/Contents/MacOS/jspice-mcp --compile-sketch tools/avr-reference/sketches/kitchen.ino build/kitchen.bin
          ./build/JSpice.app/Contents/MacOS/jspice-mcp --compile-sketch tools/avr-reference/sketches/mega.ino build/mega.bin --board mega
          ./build/JSpice.app/Contents/MacOS/jspice-mcp --compile-sketch tools/avr-reference/sketches/tiny.ino build/tiny.bin --board attiny85
      - name: Chip support for the Pico (installs arduino-pico and its gcc as the app does, compiles a sketch)
        if: hashFiles('macos/scripts/bundle.sh') != ''
        timeout-minutes: 25
        run: |
          ./build/JSpice.app/Contents/MacOS/jspice-mcp --install-chip-support rp2040
          ./build/JSpice.app/Contents/MacOS/jspice-mcp --compile-sketch tools/pico-reference/sketches/kitchen.ino build/pico-kitchen.bin --board pico
      - name: Test the simulation engine
        timeout-minutes: 15
        # optimised, as the app runs it: audio-rate tests take minutes in a debug build
        env:
          JSPICE_REQUIRE_TOOLCHAIN: '1'
        run: swift test -c release -Xswiftc -enable-testing
      - name: Interaction test (draws a circuit with synthesized mouse events)
        if: hashFiles('macos/scripts/bundle.sh') != ''
        run: ./build/JSpice.app/Contents/MacOS/JSpice --self-test "$PWD/build/screenshots"
      - name: Render screenshots
        if: hashFiles('macos/scripts/bundle.sh') != ''
        run: ./build/JSpice.app/Contents/MacOS/JSpice --screenshots "$PWD/build/screenshots"
      - name: Upload app
        if: hashFiles('macos/scripts/bundle.sh') != ''
        uses: actions/upload-artifact@v4
        with:
          name: JSpice-macOS
          path: macos/build/JSpice-macOS.zip
      - name: Upload screenshots
        if: always() && hashFiles('macos/scripts/bundle.sh') != ''
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: macos/build/screenshots
      # artifacts need a browser login to download, so the screenshots are also kept on a branch for easy viewing
      - name: Publish screenshots to the ci/macos-screenshots branch
        if: always() && github.event_name == 'push' && hashFiles('macos/build/screenshots/*.png') != ''
        working-directory: macos/build/screenshots
        run: |
          git init -q -b screenshots
          git add -- *.png
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "Screenshots of ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" screenshots:ci/macos-screenshots
