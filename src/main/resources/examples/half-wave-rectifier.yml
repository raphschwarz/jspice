# Half-wave rectifier
# A 12 V, 60 Hz sine passes through a diode into a smoothing capacitor.
# The output only follows the positive half-cycles and droops in between.
components:
- type: dc_voltage
  id: Vsrc
  nodes: in,0
  voltage: 0.0
- type: resistor
  id: Rsrc
  nodes: in,d
  resistance: 50
- type: diode
  id: D1
  nodes: d,out
  saturation_current: 3.872E-9
- type: capacitor
  id: C1
  nodes: out,0
  capacitance: 1.0E-5
- type: resistor
  id: Rload
  nodes: out,0
  resistance: 1000
sim:
  type: trans
  stop_time: 0.05
  time_step: 0.0001
  drivers:
  - type: sine
    id: Vsrc
    dc_offset: 0.0
    phase: 0.0
    amplitude: 12.0
    frequency: 60.0
