# Current source and resistor network
# YAML netlists can use every JSpice component. A 1 A current source
# pushes current into node 1; it splits between R1 and the R2-R3 branch.
components:
- type: dc_current
  id: I1
  nodes: 0,1
  current: 1.0
- type: resistor
  id: R1
  nodes: 1,0
  resistance: 10
- type: resistor
  id: R2
  nodes: 1,2
  resistance: 1000
- type: resistor
  id: R3
  nodes: 2,0
  resistance: 1000
sim:
  type: dcop
