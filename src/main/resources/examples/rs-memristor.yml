# Memristor (RS model) under a sine drive
# The resistance R(M1) collapses during the positive half-cycle and
# recovers during the negative one. Plot I(M1) against V(VDD) for the I-V loop.
components:
- type: dc_voltage
  id: Vdd
  nodes: VDD,0
  voltage: 1.0
- type: rs_mem
  id: M1
  nodes: VDD,0
  schottky_forward_alpha: 0.0
  schottky_forward_beta: 0.0
  schottky_reverse_alpha: 0.0
  schottky_reverse_beta: 0.0
  phi: 1.0
sim:
  type: trans
  stop_time: 0.001
  time_step: 1.0E-6
  drivers:
  - type: sine
    id: Vdd
    dc_offset: 0.0
    phase: 0.0
    amplitude: 1.2
    frequency: 2000.0
